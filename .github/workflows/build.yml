name: Build Memorum

# --------------------------------------------------------------------------
# Required repository secret:
#   DATABASE_URL   CockroachDB connection string, e.g.
#                  postgresql://user:pass@host:26257/defaultdb?sslmode=verify-full
#                  Settings → Secrets and variables → Actions → New repository secret
#
# Recommended repository secret:
#   JWT_SECRET     A long random string used to sign auth tokens. If unset,
#                  CI falls back to a throwaway value so the workflow still
#                  runs — but set a real one before deploying the backend.
#
# Optional repository variables (Settings → ... → Variables, not secrets —
# these are just endpoints, not credentials):
#   MEMORUM_API_URL   Where the desktop build should point for the REST API.
#   MEMORUM_WS_URL    Where the desktop build should point for the WebSocket gateway.
#   Both default to localhost, which is fine for local dev builds but should
#   be set to your deployed backend's URL for real distributed builds.
#
# Nothing in this workflow ever echoes, logs, or writes DATABASE_URL to a
# file — it is only ever exported as an environment variable directly to
# the process that needs it.
# --------------------------------------------------------------------------

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend tests (CockroachDB)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-throwaway-secret-do-not-use-in-prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Fail fast if DATABASE_URL is missing
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repository secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run test suite
        working-directory: backend
        run: pytest -v

  build-desktop:
    name: Desktop build (${{ matrix.os }})
    needs: backend-test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VITE_API_URL: ${{ vars.MEMORUM_API_URL || 'http://localhost:8000' }}
      VITE_WS_URL: ${{ vars.MEMORUM_WS_URL || 'ws://localhost:8000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Memorum desktop app
        working-directory: frontend
        run: npx tauri build

      - name: Upload Windows installers
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: memorum-windows
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS installers
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: memorum-macos
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/macos/*.app

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/memorum-windows/**
            dist/memorum-macos/**
          generate_release_notes: true
